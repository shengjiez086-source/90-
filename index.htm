let S=JSON.parse(localStorage.getItem(KEY)||'null')||{day:1,tab:'today',fav:{},done:{},stats:{played:0,typed:0},mastery:{},errors:{}};S.fav||={};S.done||={};S.stats||={played:0,typed:0};let token=0,voice=null;
const $=x=>document.getElementById(x),D=()=>C.find(x=>x.day===S.day)||C[0],save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(x){return String(x||'').toLowerCase().replace(/[.,!?，。！？]/g,'').replace(/\s+/g,' ').trim()}
function voices(){let v=speechSynthesis.getVoices()||[],p=v.filter(x=>/^en-US/i.test(x.lang));if(!p.length)p=v.filter(x=>/^en/i.test(x.lang));voice=p.find(x=>/Samantha|Ava|Allison|Karen/i.test(x.name))||p[0]||null}
if('speechSynthesis'in window){voices();speechSynthesis.onvoiceschanged=voices;setTimeout(voices,600)}
function stop(){token++;speechSynthesis&&speechSynthesis.cancel()}
function speak(text,mode='normal',lang='en-US'){if(!('speechSynthesis'in window)){alert('浏览器不支持语音');return Promise.resolve()}stop();let tk=token,u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=typeof mode==='number'?mode:SPD[mode];if(/^en/.test(lang)&&voice)u.voice=voice;return new Promise(r=>{u.onend=r;u.onerror=r;speechSynthesis.resume();setTimeout(()=>{if(tk===token)speechSynthesis.speak(u)},30);S.stats.played++;save()})}
function speeds(t){let q=JSON.stringify(t);return `<div class='speeds'><button class='speed' onclick='speak(${q},"slow")'>🐢 慢速<br><small>0.50×</small></button><button class='speed' onclick='speak(${q},"normal")'>▶ 正常<br><small>0.85×</small></button><button class='speed' onclick='speak(${q},"fast")'>⚡ 快速<br><small>1.35×</small></button></div>`}
function breakdown(en){return `<div class='chips'>${en.replace(/[.,!?]/g,'').split(/\s+/).map(w=>`<span class='chip'><b>${esc(w)}</b>${IPA[w.toLowerCase()]?`<span class='mini'>${IPA[w.toLowerCase()]}</span>`:''}</span>`).join('')}</div>`}
function go(t){stop();S.tab=t;save();render()}function setDay(d){S.day=d;S.tab='today';save();render();scrollTo(0,0)}
function nav(){let n={today:'今日',sentences:'句子',words:'单词',typing:'打字',translation:'翻译',listening:'盲听/跟读',favorites:'收藏',progress:'进度'};$('nav').innerHTML=Object.keys(n).map(k=>`<button class='${S.tab===k?'on':''}' onclick="go('${k}')">${n[k]}</button>`).join('')}
function render(){$('badge').textContent='Day '+S.day;nav();let f=({today,sentences,words,typing,translation,listening,favorites,progress})[S.tab]||today;f($('app'),D())}
function today(a,d){a.innerHTML=`<section class='hero'><div class='small'>ENGLISH 90 · V6 AUDIO ENGINE</div><h2>Day ${d.day} · ${esc(d.title)}</h2><p>重点修复：慢速、正常、快速现在是 0.50× / 0.85× / 1.35×，差距明显。</p><div class='row'><button class='primary' onclick="go('sentences')">▶ 开始学习</button><button class='secondary' onclick="test()">🔈 测试英语声音</button></div><div id='vs' class='status'>正在检测英语语音…</div></section><div class='card'><h2>学习模块</h2><div class='row'><button class='secondary' onclick="go('sentences')">🎧 核心句</button><button class='secondary' onclick="go('words')">📖 IPA 单词</button><button class='secondary' onclick="go('typing')">⌨️ 打字</button><button class='secondary' onclick="go('translation')">🧠 翻译</button><button class='secondary' onclick="go('listening')">🎧 跟读</button></div></div><div class='card'><button class='primary' onclick="S.done[S.day]=true;save();render()">✓ 完成 Day ${d.day}</button></div><div class='card'><h2>选择 Day</h2><div class='days'>${C.map(x=>`<button class='day ${x.day===S.day?'cur':''}' onclick='setDay(${x.day})'><b>Day ${x.day}</b><br><span class='small'>${esc(x.title)}</span></button>`).join('')}</div></div>`;setTimeout(()=>{$('vs').textContent=voice?'✓ 英语语音已就绪：'+voice.name:'正在加载英语语音；若无声音请点测试按钮'},50)}
function sentences(a,d){a.innerHTML=`<div class='card'><h2>今日核心句</h2><div class='small'>每句话都有三档速度和逐词 IPA。</div></div>`+d.sentences.map((s,i)=>`<div class='card'><div class='small'>Sentence ${i+1}</div><button style='float:right' class='secondary' onclick="S.fav['${s.id}']=!S.fav['${s.id}'];save();render()">${S.fav[s.id]?'★':'☆'}</button><div class='big'>${esc(s.en)}</div><div class='zh'>${esc(s.zh)}</div>${breakdown(s.en)}${speeds(s.en)}</div>`).join('')}
function words(a,d){a.innerHTML=`<div class='card'><h2>今日重点单词</h2><div class='small'>单词 + 音标 + 三档发音。</div></div>`+d.words.map(w=>`<div class='card'><div class='big'>${esc(w.word)}</div><div class='ipa'>${IPA[w.word]||''}</div><div class='zh'>${esc(w.zh)}</div>${speeds(w.word)}<div class='small' style='margin-top:12px'>例句：${esc(w.example)}</div>${speeds(w.example)}</div>`).join('')}
let ti=0,tr=0;
function typing(a,d){let s=d.sentences[ti%d.sentences.length];a.innerHTML=`<div class='card'><h2>完整句打字</h2><div class='big'>${esc(s.zh)}</div><textarea id='in' rows='3' placeholder='输入完整英文句子…'></textarea><button class='primary' onclick='checkType()'>检查</button><button class='secondary' onclick='speak(${JSON.stringify(s.en)},"normal")'>先听</button><button class='secondary' onclick='ti++;typing($("app"),D())'>下一句</button><div id='fb'></div></div>`}
function checkType(){let s=D().sentences[ti%D().sentences.length],ok=norm($('in').value)===norm(s.en);$('fb').className='feedback '+(ok?'ok':'bad');$('fb').textContent=ok?'✓ 正确！':'✗ 标准答案：'+s.en;S.stats.typed++;save()}
function translation(a,d){let s=d.sentences[tr%d.sentences.length];a.innerHTML=`<div class='card'><h2>中文 → 英文</h2><div class='big'>${esc(s.zh)}</div><textarea id='tr' rows='3' placeholder='输入英文…'></textarea><button class='primary' onclick='checkTr()'>检查</button><button class='secondary' onclick='tr++;translation($("app"),D())'>下一题</button><div id='fb'></div></div>`}
function checkTr(){let s=D().sentences[tr%D().sentences.length],ok=norm($('tr').value)===norm(s.en);$('fb').className='feedback '+(ok?'ok':'bad');$('fb').textContent=ok?'✓ 正确！':'✗ 标准答案：'+s.en}
async function blind(){for(let s of D().sentences){await speak(s.en,'normal');await new Promise(r=>setTimeout(r,500))}}
async function guide(){stop();let tk=token;for(let s of D().sentences){if(tk!==token)break;await speak(s.zh,.95,'zh-CN');if(tk!==token)break;await new Promise(r=>setTimeout(r,500));await speak(s.en,'slow');if(tk!==token)break;await new Promise(r=>setTimeout(r,1600));await speak(s.en,'normal');if(tk!==token)break;await new Promise(r=>setTimeout(r,1200))}}
function listening(a,d){a.innerHTML=`<div class='card'><h2>盲听 + 跟读</h2><p class='small'>中文 → 慢速 0.50× → 停顿 1.6 秒 → 正常 0.85×。差异明显。</p><div class='row'><button class='primary' onclick='guide()'>▶ 跟读流程</button><button class='secondary' onclick='blind()'>🎧 全部盲听</button><button class='secondary' onclick='stop()'>■ 停止</button></div><div style='margin-top:14px'>${speeds(d.sentences[0].en)}</div></div>`}
function favorites(a){let all=C.flatMap(d=>d.sentences.filter(s=>S.fav[s.id]));a.innerHTML=`<div class='card'><h2>⭐ 收藏</h2></div>`+(all.length?all.map(s=>`<div class='card'><div class='big'>${esc(s.en)}</div><div class='zh'>${esc(s.zh)}</div>${speeds(s.en)}</div>`).join(''):`<div class='card'>还没有收藏。</div>`)}
function progress(a){a.innerHTML=`<div class='card'><h2>学习数据</h2><p>完成天数：${Object.keys(S.done).length}/90</p><p>播放次数：${S.stats.played}</p><p>打字次数：${S.stats.typed}</p></div>`}
function test(){speak('Hello. This is the English ninety learning system.','normal')}
render();
</script></body></html>
